[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "looki-backend"
version = "0.1.0"
description = "LOOKi — orchestration du POC lunettes connectées"
requires-python = ">=3.12,<3.14"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn[standard]>=0.34,<1",
  "sqlalchemy[asyncio]>=2.0.36,<3", "psycopg[binary]>=3.2,<4",
  "alembic>=1.14,<2", "pydantic-settings>=2.7,<3",
  "python-multipart>=0.0.20,<1", "pillow>=11,<13", "numpy>=2,<3",
  "httpx>=0.28,<1", "websockets>=14,<16",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "pytest-asyncio>=0.25,<2", "aiosqlite>=0.20,<1", "ruff>=0.11,<1"]
vision = ["torch>=2.5,<3", "torchvision>=0.20,<1", "transformers>=4.45,<5", "unidepth==0.1", "ultralytics==8.4.182", "lap==0.5.13"]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
ignore = ["E501", "B008"]

[tool.ruff.lint.per-file-ignores]
# This sequential CLI reads manifests/source hashes before starting request timers.
"scripts/llm_benchmark/runner.py" = ["ASYNC240"]

# The deployed POC uses CPU inference. Avoid downloading CUDA on Linux hosts.
[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]
torchvision = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]
unidepth = { git = "https://github.com/lpiccinelli-eth/UniDepth.git", rev = "8d8cfe4c7ee15297099983607febf0d4f32eb3d6" }

# The upstream requirements mix training/CUDA/evaluation with inference. This
# pinned runtime subset was exercised without changing the official model code.
# Use uv sync: plain pip would install the upstream training dependencies too.
[[tool.uv.dependency-metadata]]
name = "unidepth"
version = "0.1"
requires-python = ">=3.10"
requires-dist = [
  "torch>=2.5,<3", "torchvision>=0.20,<1", "numpy>=2,<3", "pillow>=11,<13",
  "huggingface-hub>=0.34,<1", "safetensors>=0.4,<1", "einops>=0.8,<1",
  "scipy>=1.14,<2", "timm>=1.0,<2", "matplotlib>=3.9,<4",
  "wandb>=0.19,<1", "opencv-python-headless>=4.10,<6",
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
